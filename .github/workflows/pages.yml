name: OpenWhoop dashboard
on:
  push:
    branches: [master]
    paths:
      - "web/live-dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: openwhoop-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/live-dashboard/package-lock.json
      - run: npm ci
        working-directory: web/live-dashboard
      - run: npm run build
        working-directory: web/live-dashboard
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: ${{ vars.OPENWHOOP_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.OPENWHOOP_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/live-dashboard/dist
      - id: deployment
        uses: actions/deploy-pages@v4
